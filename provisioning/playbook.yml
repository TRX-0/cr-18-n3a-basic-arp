# ─────────────────────────────────────────────
#  all lab hosts - keep background apt out of the way
# ─────────────────────────────────────────────
- name: disable unattended upgrades
  hosts:
    - vm1
    - vma
  become: true

  tasks:
    # Background apt runs grab the dpkg lock and can restart services mid-exercise.
    - name: Stop and mask the apt background update units
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - apt-daily.service
        - apt-daily-upgrade.service

    - name: Remove unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: absent
        purge: true


# ─────────────────────────────────────────────
#  man - the sandbox management node. It is not in topology.yml; the platform
#  adds it to the generated inventory. Every trainee SSH and GUI session is
#  brokered through it, so an unattended upgrade firing mid-lab can stall or
#  drop those sessions.
# ─────────────────────────────────────────────
- name: disable apt auto-update on the management node
  hosts: man
  become: true

  tasks:
    - name: Disable unattended upgrades in apt periodic config
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable apt daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false


# ─────────────────────────────────────────────
#  vm1 - flag emitter
# ─────────────────────────────────────────────
- name: configure broadcasting host vm1
  hosts:
    - vm1
  become: true

  vars:
    decoy_ip: 192.168.25.99
    decoy_port: 4444
    broadcast_interval_sec: 10

  tasks:
    - name: Install netcat
      ansible.builtin.apt:
        name: netcat-openbsd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy flag emitter script
      ansible.builtin.template:
        src: flag-emitter.sh.j2
        dest: /usr/local/sbin/flag-emitter.sh
        owner: root
        group: root
        mode: '0750'
      notify: restart flag emitter timer

    - name: Deploy flag emitter service unit
      ansible.builtin.template:
        src: flag-emitter.service.j2
        dest: /etc/systemd/system/flag-emitter.service
        owner: root
        group: root
        mode: '0644'

    - name: Deploy flag emitter timer unit
      ansible.builtin.template:
        src: flag-emitter.timer.j2
        dest: /etc/systemd/system/flag-emitter.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start flag emitter timer
      ansible.builtin.systemd:
        name: flag-emitter.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart flag emitter timer
      ansible.builtin.systemd:
        name: flag-emitter.timer
        state: restarted
        daemon_reload: true


# ─────────────────────────────────────────────
#  vma - attacker workstation
# ─────────────────────────────────────────────
- name: provision attacker workstation vma
  hosts:
    - vma
  become: true

  tasks:
    # The base image ships '127.0.1.1 kali.kali kali'. The platform renames the
    # host, so that alias is stale, and the task below manages only its own line -
    # which leaves two 127.0.1.1 entries and tells anyone who reads /etc/hosts that
    # this is a stock Kali image rather than a company workstation.
    - name: Drop the base image's leftover 127.0.1.1 alias
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+kali'
        state: absent

    - name: Ensure /etc/hosts resolves the renamed hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\b'
        line: "127.0.1.1 {{ ansible_hostname }}"
        state: present

    - name: Ensure ARP-attack toolset is present
      ansible.builtin.apt:
        name:
          - bettercap
          - dsniff
        state: present
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: user-access
      user_access_username: user
      user_access_password: 'Password123'
      user_access_sudo: true
